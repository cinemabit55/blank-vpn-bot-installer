  name: RU WARP
  cabinet_override: null

country_code: RU
domain: ru-warp-01.example-node-domain.com
public_ipv4: 192.0.2.40
public_ipv6: null

domain_rotation:
  spare_domains:
    - ru-warp-01b.example-node-domain.com
    - ru-warp-01c.example-node-domain.com
  dns_ttl_seconds: 300

main_server:
  ipv4: 198.51.100.20
  remnawave_api_url: https://panel.example.com

ssh:
  port: 22
  admin_user: templar
  admin_allowlist:
    - 198.51.100.10
    - 198.51.100.20

remnanode:
  node_port: 2222
  secret_key_ref: secrets/remnanode-ru-warp-01

xray:
  xtls_api_port: 61000
  config_profile_uuid: null
  public_inbound_uuid: public-inbound-uuid

host:
  remark: null
  address: null
  port: 443
