  certificate_source: external_acme_dns01
  certificate_ca: public
  dns_api_token_ref: secrets/dns-api-token

warp:
  mode: xray_native
  outbound_tag: WARP_OUT
  reserved_source: warp_registration_client_id_b64
  reserved: null
  registration_ref: secrets/warp-ru-warp-01

transit:
  mode: disabled

bedolaga:
  internal_squad_name: loc-ru-warp
  external_squad_name: ext-ru-warp
  attach_to_tariff_slugs:
    - ru-warp
    - premium-all
