  visibility: true

reality:
  strategy: local_decoy_site
  credentials_ref: secrets/reality-public-ru-warp-01
  public_port: 443
  local_decoy_addr: 127.0.0.1
  local_decoy_port: 8443
  flow: xtls-rprx-vision
  server_names:
    - ru-warp-01.example-node-domain.com

